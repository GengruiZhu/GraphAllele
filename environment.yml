name: polyalleler
# Conda environment for GraphAllele.
#   conda env create -f environment.yml
#   conda activate polyalleler
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- core language / python libraries ---
  - python>=3.8
  - pip
  - biopython>=1.79
  - pandas>=1.3
  - networkx>=2.6
  # --- external bioinformatics tools ---
  - blast>=2.12        # makeblastdb, blastp, tblastn
  - last               # pairwise aligner used by JCVI/MCScan
  - gffread            # CDS / protein extraction from GFF3 + FASTA
  - jcvi               # MCScan synteny (python -m jcvi.compara.catalog)
  # --- optional ---
  - orthofinder        # required ONLY when running with --auto_og
